name = "demo-analytics"
main = "src/index.js"
compatibility_date = "2025-01-01"

# 自定义域名（大陆可达；workers.dev 被墙后此为主入口）
routes = [
  { pattern = "api.agarena.xyz", custom_domain = true }
]

# 允许跨域的站点来源（逗号分隔白名单，避免被任意站点盗用接口）
# 只放行你自己的托管源；其他网站的跨域请求会被浏览器拒绝。
# 若需新增来源，在此追加即可。
[vars]
ALLOW_ORIGIN = "https://agarena.github.io,https://agarena.xyz,https://www.agarena.xyz,https://prompts.agarena.xyz,https://stickers.agarena.xyz,https://ai-stickers.app.workbuddy.host,https://price.agarena.xyz"

# 智能体中继（/api/agent/chat）：公开站访客零配置用站方密钥对话。
# 模型与定价＝牌价（¥/百万 token）；预算＝站点每日上限（元）＋单 IP 每日上限（元），
# 均按北京日界切。密钥用 secret 设置（绝不写进本文件）：
#   echo <key> | cf-relay.sh npx wrangler secret put RELAY_API_KEY
RELAY_BASE_URL = "https://open.bigmodel.cn/api/paas/v4"
RELAY_MODEL = "glm-5.3-flash"
RELAY_PRICE_IN = "0.8"
RELAY_PRICE_OUT = "2.8"
RELAY_DAILY_BUDGET = "5"
RELAY_IP_DAILY_BUDGET = "1"

[[d1_databases]]
binding = "DB"
database_name = "analytics-db"
# 执行 `wrangler d1 create analytics-db` 后，把返回的 uuid 填到这里
database_id = "e24e9594-63cd-48ad-acff-f205515b2537"

# 后台密码（不要写在这里，用 secret 设置）：
#   wrangler secret put ADMIN_TOKEN

# 后台静态资产（chart.js 自托管，摆脱 jsdelivr CDN 大陆阻塞）
[assets]
directory = "./public"
